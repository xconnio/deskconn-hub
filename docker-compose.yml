services:
  deskconn-hub:
    image: xconnio/deskconn-hub:latest
    container_name: deskconn-hub
    env_file:
      - .env
    ports:
      - "8081:8081/udp"
      - "8082:8082/udp"
      - "8083:8083"
      - "127.0.0.1:8084:8084"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

networks:
  default:
    name: deskconn
    external: true
